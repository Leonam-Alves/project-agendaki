<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/script.js" defer></script>
    <title>Agendaki</title>
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <section>
            <h2>Novo Agendamento</h2>
            <form id="form-agendamento" th:action="@{/agendamentos}" th:object="${agendamento}" method="post">

                <p th:if="${erroNegocio != null}" th:text="${erroNegocio}" class="mensagem-erro"></p>

                <label for="clienteId">Cliente:</label>
                <select id="clienteId" th:field="*{clienteId}" th:errorclass="campo-erro">
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                </select>
                <p th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}" class="mensagem-erro"></p>

                <label for="profissionalId">Profissional:</label>
                <select id="profissionalId" th:field="*{profissionalId}" th:errorclass="campo-erro">
                    <option th:each="p : ${profissionais}" th:value="${p.id}" th:text="${p.nome}"></option>
                </select>
                <p th:if="${#fields.hasErrors('profissionalId')}" th:errors="*{profissionalId}" class="mensagem-erro"></p>

                <label for="categoriaId">Categoria:</label>
                <select id="categoriaId" th:field="*{categoriaId}" th:errorclass="campo-erro">
                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                </select>
                <p th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}" class="mensagem-erro"></p>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" th:field="*{descricao}" placeholder="Descreva o agendamento" th:errorclass="campo-erro"></textarea>
                <p th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="mensagem-erro"></p>

                <label for="data">Data:</label>
                <input id="data" th:field="*{data}" type="date" th:errorclass="campo-erro">
                <p th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="mensagem-erro"></p>

                <label for="hora">Hora:</label>
                <input id="hora" th:field="*{hora}" type="time" th:errorclass="campo-erro">
                <p th:if="${#fields.hasErrors('hora')}" th:errors="*{hora}" class="mensagem-erro"></p>

                <p id="mensagem-erro" class="mensagem-erro"></p>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
