<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/script.js" defer></script>
    <title>Agendaki</title>
</head>
<body>
    <header>
        <h1>Agendaki</h1>
        <nav>
            <a th:href="@{/}">Página inicial</a>
            <a th:href="@{/agendamentos/novo}">Novo Agendamento</a>
            <a th:href="@{/agendamentos}">Todos Agendamentos</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Novo Agendamento</h2>
            <form id="form-agendamento" th:action="@{/agendamentos}" th:object="${agendamento}" method="post">

                <label for="nome">Nome:</label>
                <input id="nome" th:field="*{nome}" type="text" placeholder="Insira seu nome" th:errorclass="campo-erro">
                <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="mensagem-erro"></p>

                <label for="telefone">Telefone:</label>
                <input id="telefone" th:field="*{telefone}" type="tel" placeholder="(xx) xxxxx-xxxx" th:errorclass="campo-erro">
                <p th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="mensagem-erro"></p>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" th:field="*{descricao}" placeholder="Descreva o agendamento" th:errorclass="campo-erro"></textarea>
                <p th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="mensagem-erro"></p>

                <label for="data">Data:</label>
                <input id="data" th:field="*{data}" type="date" th:errorclass="campo-erro">
                <p th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="mensagem-erro"></p>

                <label for="hora">Hora:</label>
                <input id="hora" th:field="*{hora}" type="time" th:errorclass="campo-erro">
                <p th:if="${#fields.hasErrors('hora')}" th:errors="*{hora}" class="mensagem-erro"></p>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Agendaki</p>
        <p>Sistema de Agendamentos</p>
        <p>2026 - Todos os direitos reservados</p>
    </footer>
</body>
</html>
