<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/script.js" defer></script>
    <title>Agendaki</title>
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <section>
            <h2>Agendados Recentes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Telefone</th>
                        <th>Profissional</th>
                        <th>Categoria</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="agendamento : ${agendamentos}">
                        <td th:text="${agendamento.id}"></td>
                        <td th:text="${agendamento.clienteNome}"></td>
                        <td th:text="${agendamento.clienteTelefone}"></td>
                        <td th:text="${agendamento.profissionalNome}"></td>
                        <td th:text="${agendamento.categoriaNome}"></td>
                        <td th:text="${agendamento.data}"></td>
                        <td th:text="${agendamento.hora}"></td>
                        <td th:text="${agendamento.status}"></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
