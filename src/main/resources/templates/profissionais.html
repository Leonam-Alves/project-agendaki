<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/script.js" defer></script>
    <title>Agendaki</title>
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <section>
            <h2>Profissionais</h2>
            <a th:href="@{/profissionais/novo}" class="link-acao">+ Novo Profissional</a>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Registro (CRM)</th>
                        <th>Telefone</th>
                        <th>Categoria</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="profissional : ${profissionais}">
                        <td th:text="${profissional.id}"></td>
                        <td th:text="${profissional.nome}"></td>
                        <td th:text="${profissional.registroProfissional}"></td>
                        <td th:text="${profissional.telefone}"></td>
                        <td th:text="${profissional.categoriaNome}"></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
